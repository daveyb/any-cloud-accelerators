name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Default make target
        run: make

      - name: Build base and openssl images
        run: make base openssl

      - name: Verify openssl installs into lib/
        run: |
          TAG="aca-openssl:$(grep '^OPENSSL_VERSION' Makefile | awk '{print $3}' | tr -d '\r')"
          docker run --rm "$TAG" ls /usr/local/src/openssl/lib | grep -q libssl
